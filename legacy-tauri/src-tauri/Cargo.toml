[package]
name = "dir-lister-gui"
version = "0.1.0"
description = "A simple app that lists directory names to a chosen depth, with optional Xbox 360 GOD title recognition"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
csv = "1"

[[bin]]
name = "dir-lister-gui"
path = "src/main.rs"
